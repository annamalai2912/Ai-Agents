name: Weekly Tech Opportunity Radar

on:
  schedule:
    - cron: "0 2 * * 1"  # Every Monday at 02:00 UTC (07:30 AM IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Dependencies
        run: pip install -r job-radar-agent/requirements.txt

      - name: Run Job Radar
        working-directory: ./job-radar-agent
        run: python crew_radar.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini/gemini-3.5-flash-lite
          DRIVE_WEBHOOK_URL: ${{ secrets.DRIVE_WEBHOOK_URL }}
          DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}

      - name: Commit & Push Opportunity Digest
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add job-radar-agent/OPPORTUNITIES_RADAR.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs(jobs): update remote opportunity radar [skip ci]" && git push)
