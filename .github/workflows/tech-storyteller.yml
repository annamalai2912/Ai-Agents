name: Generate Tech Article & Social Posts

on:
  workflow_dispatch:
    inputs:
      target_path:
        description: "Target repository path to analyze"
        required: false
        default: "."

permissions:
  contents: write

jobs:
  storytell:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Dependencies
        run: pip install -r tech-storyteller/requirements.txt

      - name: Run Tech Storyteller
        working-directory: ./tech-storyteller
        run: python crew_storyteller.py "${{ github.event.inputs.target_path }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini/gemini-3.5-flash-lite

      - name: Commit Generated Article & Posts
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add tech-storyteller/generated_article.md tech-storyteller/social_posts.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs(content): generate technical article and social posts [skip ci]" && git push)
