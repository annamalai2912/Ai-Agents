name: Daily OSS Contributor Scout

on:
  schedule:
    - cron: "0 1 * * *"  # Daily at 01:00 UTC (06:30 AM IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Dependencies
        run: pip install -r oss-contributor-scout/requirements.txt

      - name: Run OSS Contributor Scout
        working-directory: ./oss-contributor-scout
        run: python crew_scout.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini/gemini-3.5-flash-lite
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_LANGUAGES: python,typescript,javascript,go,rust
          DRIVE_WEBHOOK_URL: ${{ secrets.DRIVE_WEBHOOK_URL }}
          DRIVE_SECRET: ${{ secrets.DRIVE_SECRET }}

      - name: Commit & Push Daily Digest
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add oss-contributor-scout/contributions_digest.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(digest): update open-source opportunities [skip ci]" && git push)
